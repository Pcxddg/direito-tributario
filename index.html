<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prova de Direito Tributário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: cuaderno de estudio fiscal. Barra lateral fija en escritorio y barra inferior en el móvil;
   columna de lectura de ~70ch con marca-texto amarillo en los términos clave y sellos ("carimbos") para los estados. */
:root{
  --paper:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#13221E; --ink-2:#51625C; --line:#D2DBD6;
  --accent:#0A6B6B; --accent-ink:#FFFFFF; --accent-soft:#D6EBE8;
  --marker:#F6D84C; --marker-ink:#13221E;
  --good:#1D7A46; --good-soft:#DDF0E4; --bad:#B42318; --bad-soft:#F9E3E0; --warn:#8C5E05; --warn-soft:#F5EBD2;
  --sp-imp:#0A6B6B; --sp-tax:#9A5B12; --sp-cm:#5A48A8;
  --shadow:0 1px 0 rgba(19,34,30,.05), 0 10px 24px -16px rgba(19,34,30,.35);
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1513; --surface:#151F1C; --surface-2:#1B2723; --ink:#E3ECE8; --ink-2:#9BADA6; --line:#2B3A35;
    --accent:#3DB5AC; --accent-ink:#04201E; --accent-soft:#16332F;
    --marker:#6F5B13; --marker-ink:#FFF5CC;
    --good:#4CC183; --good-soft:#132D1E; --bad:#F27B6E; --bad-soft:#381915; --warn:#E4B04C; --warn-soft:#32280F;
    --sp-imp:#3DB5AC; --sp-tax:#E0A458; --sp-cm:#A898F0;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1513; --surface:#151F1C; --surface-2:#1B2723; --ink:#E3ECE8; --ink-2:#9BADA6; --line:#2B3A35;
  --accent:#3DB5AC; --accent-ink:#04201E; --accent-soft:#16332F;
  --marker:#6F5B13; --marker-ink:#FFF5CC;
  --good:#4CC183; --good-soft:#132D1E; --bad:#F27B6E; --bad-soft:#381915; --warn:#E4B04C; --warn-soft:#32280F;
  --sp-imp:#3DB5AC; --sp-tax:#E0A458; --sp-cm:#A898F0;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
b,strong{font-weight:700}

/* ---------- Shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--font-display);font-weight:800;font-stretch:110%;font-size:15px;letter-spacing:.02em}
.brand b{display:block;font-family:var(--font-display);font-stretch:108%;font-weight:800;font-size:15px;line-height:1.1}
.brand span.brand-s{display:block;font-size:12px;color:var(--ink-2)}
.sync{font-family:var(--font-mono);font-size:11px;flex:none;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.sync[data-mode="cloud"]::before{background:var(--good)}
.sync[data-mode="local"]::before{background:var(--warn)}
.sync[data-mode="error"]::before{background:var(--bad)}

.main{min-width:0;padding-inline:16px;padding-block:24px 112px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--ink-2);text-decoration:none}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media (min-width:960px){
  .app{grid-template-columns:252px minmax(0,1fr)}
  .mtop,.tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .rail-foot p{margin:0;font-size:12px;color:var(--ink-2)}
  .main{padding-block:40px 64px;padding-inline:32px}
}

/* ---------- Type ---------- */
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-weight:800;font-stretch:112%;font-size:clamp(30px,6vw,46px);line-height:1.02;letter-spacing:-.015em}
h2{font-weight:800;font-stretch:106%;font-size:22px;line-height:1.15}
h3{font-weight:700;font-stretch:104%;font-size:19px;line-height:1.2}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:17px;max-width:60ch}
mark{background:linear-gradient(transparent 14%,var(--marker) 14%,var(--marker) 90%,transparent 90%);color:var(--marker-ink);padding:0 .12em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.art{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;vertical-align:.12em;letter-spacing:0;font-stretch:100%}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--accent);padding-inline:10px}
.btn-quiet:hover{background:var(--accent-soft);border-color:transparent}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row-between{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type="date"],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;max-width:100%}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}
input[type="date"]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}

/* Sello (carimbo) */
.stamp{display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp,var(--accent));border:2px solid currentColor;outline:1px solid currentColor;outline-offset:2px;border-radius:4px;padding:2px 8px;transform:rotate(-3deg);white-space:nowrap}

/* ---------- Panel ---------- */
.hero{display:grid;gap:14px;position:relative}
.hero-sub{color:var(--ink-2);font-size:17px;max-width:58ch}
.count{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px 18px;border:1.5px dashed var(--line);border-radius:var(--r)}
.count-big{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-weight:800;font-stretch:112%;font-size:44px;line-height:1;color:var(--bad)}
.count-big small{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.count p{font-size:14px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.tile-n{font-family:var(--font-display);font-weight:800;font-stretch:108%;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile-n small{font-size:16px;color:var(--ink-2);font-weight:700}
.tile-l{font-size:13px;color:var(--ink-2)}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.next{display:grid;gap:12px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.next .eyebrow{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.next h2{color:var(--paper)}
.next p{color:color-mix(in srgb,var(--paper) 78%,transparent)}
.next .btn-primary{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.prof-list{display:grid;gap:14px}
.prof-row{display:grid;gap:8px}
.prof-row .eyebrow{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.lnk.done::after{content:"✓";color:var(--good)}
.lnk.plain{font-weight:400;color:var(--ink-2);cursor:default}
.mastery{display:grid;gap:10px}
.m-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.m-name{font-weight:700;font-size:15px;min-width:0}
.m-pct{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.m-bar{grid-column:1/-1;height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.m-bar i{display:block;height:100%;border-radius:8px}
.m-act{grid-column:1/-1;justify-self:start}
@media (min-width:640px){
  .m-row{grid-template-columns:200px minmax(0,1fr) 92px auto}
  .m-bar{grid-column:auto}
  .m-act{grid-column:auto}
}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-2);font-family:var(--font-mono);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt-last{fill:var(--accent)}
.chart .val{fill:var(--ink);font-family:var(--font-mono);font-size:12px;font-weight:600}
.hist{display:grid;gap:0;margin-top:8px}
.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist-row b{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--ink-2);font-size:15px}

/* ---------- Lista de módulos ---------- */
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mrow:hover{border-color:var(--accent)}
.mrow-n{grid-row:span 3;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;background:var(--surface-2);color:var(--ink)}
.mrow.done .mrow-n{background:var(--accent);color:var(--accent-ink)}
.mrow-t{font-family:var(--font-display);font-weight:800;font-stretch:104%;font-size:18px;line-height:1.2}
.mrow-s{font-size:14px;color:var(--ink-2)}
.mrow-m{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.prio{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.prio-3{background:var(--bad-soft);color:var(--bad)}
.prio-2{background:var(--warn-soft);color:var(--warn)}
.tag{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.fast{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
.fast a{font-family:var(--font-mono);font-weight:600;text-decoration:none;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink)}

/* ---------- Módulo ---------- */
.crumbs{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mod-head{display:grid;gap:10px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.summary h2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.summary ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.summary li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;counter-increment:s}
.summary li::before{content:counter(s);font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.lesson{display:grid;gap:16px;font-size:17px;line-height:1.62}
.lesson > *{min-width:0}
.lesson h3{margin-top:14px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.lesson p{max-width:70ch}
.lead{font-size:19px;line-height:1.55}
.lesson ul.clean{margin:0;padding-left:20px;display:grid;gap:8px}
.box{border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:16px}
.box p{max-width:none}
.box-h{justify-self:start;display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:.11em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:4px;padding:1px 8px;transform:rotate(-1.5deg)}
.box.prof{background:var(--accent-soft)} .box.prof .box-h{color:var(--accent)}
.box.trap{background:var(--bad-soft)} .box.trap .box-h{color:var(--bad)}
.box.tech{background:var(--warn-soft)} .box.tech .box-h{color:var(--warn)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{width:100%;border-collapse:collapse;font-size:15px;min-width:460px}
.cmp th,.cmp td{padding:11px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.cmp thead th{border-top:0;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--surface-2)}
.cmp tbody th{color:var(--ink-2);font-weight:700;font-size:14px;width:28%}
.sides{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px;font-size:15px}
.side b{font-family:var(--font-display);font-size:18px;font-stretch:104%}
.side-link{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.side-link span{border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);padding:4px 8px}
@media (min-width:640px){.sides{grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);align-items:center}}
.balance{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:22px}
.balance::before{content:"";position:absolute;top:6px;left:18%;right:18%;height:4px;border-radius:4px;background:var(--ink)}
.pan{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;font-size:15px}
.pan::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--ink-2)}
.pan b{font-family:var(--font-display);font-size:17px}
.fulcrum{grid-column:1/-1;display:grid;justify-items:center;gap:2px;text-align:center;font-size:15px;padding-top:4px}
.fulcrum::before{content:"";width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:22px solid var(--ink);margin-bottom:6px}
.fulcrum b{font-family:var(--font-display);font-size:17px}
.fulcrum span{color:var(--ink-2)}
ol.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;counter-reset:f}
ol.flow li{counter-increment:f;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;font-size:15px}
ol.flow li::before{content:"0" counter(f);font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600}
ol.flow li b{font-family:var(--font-display);font-size:17px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;font-size:15px;align-content:start}
.kc b{font-family:var(--font-display);font-size:17px;font-stretch:104%}
.kc > span:not(.eyebrow){color:var(--ink-2)}
.chips,.chips-rows > div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-rows{display:grid;gap:8px}
.chips-rows .eyebrow{min-width:96px}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip small{color:var(--ink-2);font-size:10.5px}
.chip-ghost{border-style:dashed;color:var(--ink-2)}
.tree{display:grid;gap:12px}
.tree-q{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:14px 16px;font-weight:700;text-align:center}
.tree-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tree-b{display:grid;gap:6px;align-content:start}
.tree-a{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);text-align:center}
.tree-a::before{content:"↓ ";color:var(--ink)}

  body: `
<p class="lead">El Derecho Tributario es la rama del <mark>Direito Público</mark> que regula la relación entre el <b>fisco</b> (el Estado que cobra) y el <b>contribuinte</b> (quien paga). Su objeto central son los tributos: cómo se <b>crean</b>, cómo se <b>cobran</b> y cómo se <b>controlan</b>.</p>

<h3>Los dos lados de la relación</h3>
<div class="sides">
  <div class="side"><span class="eyebrow">Sujeito passivo</span><b>Contribuinte</b><p>Persona física, MEI, sociedad anónima, sociedad de hecho, sociedad en cuenta de participación: todos son contribuyentes.</p></div>
  <div class="side-link" aria-hidden="true"><span>relação jurídico-tributária</span></div>
  <div class="side"><span class="eyebrow">Sujeito ativo</span><b>Ente público</b><p>União, Estados, Distrito Federal o Municípios: quien tiene el derecho de cobrar.</p></div>
</div>

<h3>La balança de dupla função</h3>
<p>Funciona como una balanza con dos funciones a la vez: <b>autoriza</b> al Estado a crear y cobrar tributos y, al mismo tiempo, <b>limita</b> ese poder para proteger al ciudadano.</p>
<div class="balance">
  <div class="pan"><span class="eyebrow">Un plato</span><b>Poder do Estado</b><p>Competencia para instituir y cobrar los tributos previstos en la Constitución.</p></div>
  <div class="pan"><span class="eyebrow">El otro plato</span><b>Limite ao poder</b><p>Principios que protegen al contribuinte: legalidade, anterioridade, irretroatividade, capacidade contributiva.</p></div>
  <div class="fulcrum"><b>Equilíbrio</b><span>Relación definida en ley, con derechos y deberes para los dos lados.</span></div>
</div>

  var state = (function () { try { return norm(JSON.parse(localStorage.getItem(LS))); } catch (e) { return blank(); } })();

  function save() { state.updatedAt = Date.now(); saveLocal(); queueRemote(); }

  var SYNC = { connecting: 'Conectando…', cloud: 'Guardado en tu cuenta', local: 'Guardado en este navegador', error: 'Sin conexión · guardado aquí' };
  var syncMode = 'connecting';
  function setSync(m) { syncMode = m; document.querySelectorAll('[data-sync]').forEach(function (el) { el.textContent = SYNC[m]; el.setAttribute('data-mode', m); }); }

  var dbDoc = null, remoteT = null, chain = Promise.resolve(), lastSent = '';
  function queueRemote(delay) { if (!dbDoc) return; clearTimeout(remoteT); remoteT = setTimeout(pushRemote, delay == null ? 1500 : delay); }
  function pushRemote() {
    if (!dbDoc) return;
    var body = JSON.stringify(state);
    if (body === lastSent) return;
    var ref = dbDoc;
    chain = chain.then(function () { return ref.set(JSON.parse(body)); })
      .then(function () { lastSent = body; setSync('cloud'); })
      .catch(function (e) {
        var c = e && e.code;
        if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { dbDoc = null; setSync('local'); }
        else setSync('error');
      });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { clearTimeout(remoteT); pushRemote(); } });

  function initRemote() {
    var tries = 0;
    (function wait() {
      if (window.claude && typeof window.claude.use === 'function') return connect();
      if (++tries > 20) return setSync('local');
      setTimeout(wait, 150);
    })();
    function connect() {
      Promise.all([window.claude.use('user'), window.claude.use('db')]).then(function (r) {
        var user = r[0], db = r[1];
        if (!user || !db) { setSync('local'); return; }
        return user.id().then(function (uid) {
          if (!uid) { setSync('local'); return; }
          var ref = db.doc('data/users/' + uid + '/estudo');
          return ref.get().then(function (snap) {
            dbDoc = ref;
            var remote = snap.exists ? snap.data() : null;
            if (remote && remote.v === 1 && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
              state = norm(JSON.parse(JSON.stringify(remote)));
              saveLocal(); lastSent = JSON.stringify(state);
              setSync('cloud'); render(false);
            } else if (state.updatedAt > 0 && (!remote || state.updatedAt > (remote.updatedAt || 0))) {
              setSync('cloud'); queueRemote(0);
            } else { lastSent = JSON.stringify(state); setSync('cloud'); }
          });
        });
      }).catch(function () { setSync('local'); });
    }
  }

  /* ---------------- sesión de preguntas ---------------- */
  var sess = (function () { try { var s = JSON.parse(localStorage.getItem(LS_SESS)); return s && s.items && s.items.every(function (it) { return QMAP[it.id]; }) ? s : null; } catch (e) { return null; } })();
  function saveSess() { try { if (sess) localStorage.setItem(LS_SESS, JSON.stringify(sess)); else localStorage.removeItem(LS_SESS); } catch (e) { } }

  function record(q, ok) {
    var s = state.stats[q.t] || [0, 0]; s = [s[0] + (ok ? 1 : 0), s[1] + 1]; state.stats[q.t] = s;
    state.seen[q.id] = (state.seen[q.id] || 0) + 1;
    if (ok) delete state.wrong[q.id]; else state.wrong[q.id] = 1;
  }

  function pickFrom(pool, n, gens) {
    var scored = pool.map(function (q) { return { q: q, s: (state.seen[q.id] || 0) + Math.random() * 1.6 - (state.wrong[q.id] ? 0.6 : 0) }; });
    scored.sort(function (a, b) { return a.s - b.s; });
    var out = [];
    scored.forEach(function (o) {
      if (out.length >= n) return;
      if (o.q.gen) { if (gens.has(o.q.gen)) return; gens.add(o.q.gen); }
      out.push(o.q);
    });
    scored.forEach(function (o) { if (out.length < n && out.indexOf(o.q) < 0) out.push(o.q); });
    return out;
  }
  function makeItems(qs) { return qs.map(function (q) { return { id: q.id, order: shuffle([0, 1, 2, 3]) }; }); }

  function startSession(kind, arg) {
    var items, title, mode = 'practice', gens = new Set();
    if (kind === 'exam') {
      var list = [];
      Object.keys(QUOTA).forEach(function (t) { list = list.concat(pickFrom(QS.filter(function (q) { return q.t === t; }), QUOTA[t], gens)); });
      items = makeItems(shuffle(list)); title = 'Simulacro de 20 preguntas'; mode = 'exam';
    } else if (kind === 'quick') {
      items = makeItems(pickFrom(QS.slice(), 10, gens)); title = 'Práctica rápida';
    } else if (kind === 'topic') {
      var pool = QS.filter(function (q) { return q.t === arg; });
      items = makeItems(shuffle(pickFrom(pool, Math.min(10, pool.length), gens))); title = 'Práctica · ' + TOP[arg].name;
    } else if (kind === 'wrong') {
      var ids = Array.isArray(arg) ? arg : Object.keys(state.wrong);
      items = makeItems(shuffle(ids.filter(function (id) { return QMAP[id]; }).map(function (id) { return QMAP[id]; })).slice(0, 20));
      title = 'Repaso de errores';
    }
    if (!items || !items.length) { toast('No hay preguntas para este modo todavía.'); return; }
    var replaced = sess && !sess.fin;
    sess = { mode: mode, title: title, items: items, ans: items.map(function () { return null; }), cur: 0, start: Date.now(), fin: false };
    saveSess();
    if (replaced) toast('Empezaste un simulacro nuevo.');
    go('simulado');
  }

  function finishSession() {
    var byTopic = {}, ok = 0;
    sess.items.forEach(function (it, i) {
      var q = QMAP[it.id], a = sess.ans[i], good = a != null && it.order[a] === 0;
      if (good) ok++;
      var b = byTopic[q.t] || [0, 0]; byTopic[q.t] = [b[0] + (good ? 1 : 0), b[1] + 1];
      if (sess.mode === 'exam') record(q, good);
    });
    var n = sess.items.length, secs = Math.round((Date.now() - sess.start) / 1000);
    sess.fin = true; sess.res = { ok: ok, n: n, score: ok / n * 10, secs: secs, byTopic: byTopic };
    state.exams.push({ at: Date.now(), mode: sess.mode, title: sess.title, ok: ok, n: n, score: Math.round(ok / n * 100) / 10, secs: secs, byTopic: byTopic });
    if (state.exams.length > 40) state.exams = state.exams.slice(-40);
    save(); saveSess();
  }

  /* ---------------- navegación ---------------- */
  var VIEWS = ['panel', 'estudiar', 'simulado', 'tarjetas', 'notas'];
  function parse(h) { h = (h || '').replace(/^#/, ''); if (h.indexOf('m-') === 0 && MMAP[h.slice(2)]) return { v: 'modulo', id: h.slice(2) }; if (VIEWS.indexOf(h) >= 0) return { v: h }; return { v: 'panel' }; }
  var route = parse(location.hash);
  function go(token) {
    route = parse(token);
    try { history.pushState(null, '', '#' + token); } catch (e) { }
    render(true);
  }
  window.addEventListener('popstate', function () { route = parse(location.hash); render(true); });
  window.addEventListener('hashchange', function () { var r = parse(location.hash); if (r.v !== route.v || r.id !== route.id) { route = r; render(true); } });

  function render(top) {
    var navKey = route.v === 'modulo' ? 'estudiar' : route.v;
    document.querySelectorAll('[data-nav]').forEach(function (a) { if (a.getAttribute('data-nav') === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var html = route.v === 'estudiar' ? studyHTML() : route.v === 'modulo' ? moduleHTML(MMAP[route.id]) : route.v === 'simulado' ? simHTML() : route.v === 'tarjetas' ? cardsHTML() : route.v === 'notas' ? notesHTML() : panelHTML();
    view.innerHTML = '<div class="wrap">' + html + '</div>';
    bind();
    if (top) { window.scrollTo(0, 0); }
    setSync(syncMode);
  }

  /* ---------------- PANEL ---------------- */
  function countdownHTML() {
    if (!state.examDate) {
      return '<div class="count"><div style="display:grid;gap:4px"><b>¿Cuándo es la prueba?</b><p>El profesor dijo "a semana que vem". Pon la fecha y te muestro cuántos días faltan.</p></div>' +
        '<input type="date" id="exam-date" aria-label="Fecha de la prueba"></div>';
    }
    var d = new Date(state.examDate + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
    var days = Math.round((d - t) / 864e5), big, label;
    if (days > 1) { big = days; label = 'días para la prueba'; }
    else if (days === 1) { big = 1; label = 'día: es mañana'; }
    else if (days === 0) { big = '¡Hoy!'; label = 'es el día de la prueba'; }
    else { big = '✓'; label = 'la prueba ya pasó'; }
    var when = ''; try { when = d.toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { when = state.examDate; }
    return '<div class="count"><div class="count-big num">' + big + ' <small>' + label + '</small></div>' +
      '<p>Prueba: ' + esc(when) + '</p><input type="date" id="exam-date" aria-label="Cambiar la fecha de la prueba" value="' + esc(state.examDate) + '"></div>';
  }

  function chartSVG(list) {
    var pts = list.slice(-12);
    if (pts.length < 2) return '';
    var W = 600, H = 200, Lp = 36, R = 24, T = 22, B = 28;
    function x(i) { return Lp + i * (W - Lp - R) / (pts.length - 1); }
    function y(v) { return T + (10 - v) * (H - T - B) / 10; }
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Notas de los últimos simulacros, de 0 a 10">';
    [0, 5, 10].forEach(function (v) { s += '<line class="grid" x1="' + Lp + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="axis" x="' + (Lp - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
    var line = pts.map(function (e, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(e.score).toFixed(1); }).join(' ');
    s += '<path class="area" d="' + line + ' L' + x(pts.length - 1) + ' ' + y(0) + ' L' + x(0) + ' ' + y(0) + ' Z"/>';
    s += '<path class="ln" d="' + line + '"/>';
    pts.forEach(function (e, i) { var last = i === pts.length - 1; s += '<circle class="pt' + (last ? ' pt-last' : '') + '" cx="' + x(i) + '" cy="' + y(e.score) + '" r="' + (last ? 5.5 : 4) + '"/>'; });
    var lastE = pts[pts.length - 1], lx = x(pts.length - 1), ly = y(lastE.score);
    s += '<text class="val" x="' + lx + '" y="' + (ly < T + 14 ? ly + 20 : ly - 11) + '" text-anchor="end">' + nota(lastE.score) + '</text>';
    s += '<text class="axis" x="' + Lp + '" y="' + (H - 8) + '">1.º</text><text class="axis" x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end">último</text>';
    return s + '</svg>';
  }

  function panelHTML() {
    var done = MODS.filter(function (m) { return state.mods[m.id]; }).length;
    var ans = 0, okA = 0; Object.keys(state.stats).forEach(function (k) { okA += state.stats[k][0]; ans += state.stats[k][1]; });
    var exams = state.exams.filter(function (e) { return e.mode === 'exam'; });
    var best = exams.length ? Math.max.apply(null, exams.map(function (e) { return e.score; })) : null;
    var last = exams.length ? exams[exams.length - 1] : null;
    var wrongN = Object.keys(state.wrong).filter(function (id) { return QMAP[id]; }).length;
    var next = MODS.filter(function (m) { return !state.mods[m.id]; })[0];

    var h = '<header class="hero"><span class="eyebrow">Prova objetiva · 20 questões de marcar</span>' +
      '<h1>Prova de Direito Tributário</h1>' +
      '<p class="hero-sub">Todo elegido según lo que el profesor dijo en clase. Las explicaciones están en español; las preguntas de práctica, en portugués, como en la prueba.</p>' +
      countdownHTML() + '</header>';

    if (sess && !sess.fin) {
      var answered = sess.ans.filter(function (a) { return a != null; }).length;
      h += '<section class="card row-between"><div style="display:grid;gap:2px"><span class="eyebrow">En curso</span><b>' + esc(sess.title) + '</b><span class="muted">' + answered + ' de ' + sess.items.length + ' respondidas</span></div><a class="btn btn-primary" href="#simulado">Continuar</a></section>';
    }

    h += '<section class="tiles">' +
      '<div class="tile"><span class="tile-n">' + done + '<small>/' + MODS.length + '</small></span><span class="tile-l">Módulos estudiados</span><div class="meter"><i style="width:' + (done / MODS.length * 100) + '%"></i></div></div>' +
      '<div class="tile"><span class="tile-n">' + ans + '</span><span class="tile-l">Preguntas respondidas' + (ans ? ' · ' + Math.round(okA / ans * 100) + '% de acierto' : '') + '</span></div>' +
      '<div class="tile"><span class="tile-n">' + (best != null ? nota(best) : '–') + '</span><span class="tile-l">Mejor simulacro (de 10)</span></div>' +
      '<div class="tile"><span class="tile-n">' + (last ? nota(last.score) : '–') + '</span><span class="tile-l">Último simulacro' + (last ? ' · ' + last.ok + '/' + last.n : '') + '</span></div>' +
      '</section>';

    if (next) {
      h += '<section class="card next"><span class="eyebrow">Siguiente paso · módulo ' + next.n + '</span><h2>' + esc(next.title) + '</h2><p>' + esc(next.sub) + ' · ' + next.min + ' min</p><div class="row"><a class="btn btn-primary" href="#m-' + next.id + '">Estudiar ahora</a></div></section>';
    } else {
      h += '<section class="card next"><span class="eyebrow">Estudiaste los 10 módulos</span><h2>Ahora, simulacros hasta pasar de 8</h2><p>Cada simulacro arma preguntas distintas. Repite hasta que tu nota sea estable.</p><div class="row"><button class="btn btn-primary" data-act="start-exam">Hacer un simulacro</button>' + (wrongN ? '<button class="btn" data-act="start-wrong" style="color:var(--paper);background:transparent;border-color:color-mix(in srgb,var(--paper) 40%,transparent)">Repasar ' + wrongN + ' errores</button>' : '') + '</div></section>';
    }

    function lk(id) { var m = MMAP[id]; return '<a class="lnk' + (state.mods[id] ? ' done' : '') + '" href="#m-' + id + '">' + esc(m.title) + '</a>'; }
    h += '<section class="card"><div class="section-h"><h2>Lo que dijo el profesor</h2><span class="eyebrow">De la clase</span></div><div class="prof-list">' +
      '<div class="prof-row"><span class="eyebrow"><span class="dot" style="background:var(--bad)"></span>Dijo que cae</span><div class="links">' + ['ciclo', 'lancamento', 'especies', 'tributo', 'vida', 'reforma'].map(lk).join('') + '</div></div>' +
      '<div class="prof-row"><span class="eyebrow"><span class="dot" style="background:var(--warn)"></span>Explicó con énfasis</span><div class="links">' + ['fundamentos', 'principios', 'obrigacao', 'imunidade'].map(lk).join('') + '</div></div>' +
      '<div class="prof-row"><span class="eyebrow"><span class="dot" style="background:var(--ink-2)"></span>Puedes dejarlo</span><div class="links"><span class="lnk plain">Pirámide de fuentes</span><span class="lnk plain">Responsabilidade tributária</span><span class="lnk plain">Casos STF/STJ del Manual</span><span class="lnk plain">Vigência e interpretação</span><span class="lnk plain">Empréstimos compulsórios</span></div></div>' +
      '</div></section>';

    var rows = Object.keys(TOP).map(function (t) { var s = state.stats[t] || [0, 0]; return { t: t, ok: s[0], n: s[1], p: s[1] ? s[0] / s[1] : -1 }; });
    rows.sort(function (a, b) { var ap = a.n >= 3 ? a.p : 2, bp = b.n >= 3 ? b.p : 2; return ap - bp; });
    h += '<section class="card"><div class="section-h"><h2>Dominio por tema</h2><span class="eyebrow">Lo más débil primero</span></div><div class="mastery">' +
      rows.map(function (r) {
        var has = r.n >= 3, pct = has ? Math.round(r.p * 100) : 0;
        return '<div class="m-row"><span class="m-name">' + esc(TOP[r.t].name) + '</span>' +
          '<div class="m-bar" aria-hidden="true"><i style="width:' + (has ? pct : 0) + '%;background:' + (has ? pctColor(r.p) : 'transparent') + '"></i></div>' +
          '<span class="m-pct">' + (has ? pct + '% · ' + r.ok + '/' + r.n : r.n ? r.ok + '/' + r.n : 'sin datos') + '</span>' +
          '<button class="btn btn-sm btn-quiet m-act" data-act="start-topic" data-topic="' + r.t + '">Practicar</button></div>';
      }).join('') + '</div></section>';

    h += '<section class="card"><div class="section-h"><h2>Evolución de tus simulacros</h2>' + (wrongN ? '<button class="btn btn-sm" data-act="start-wrong">Repasar ' + wrongN + ' errores</button>' : '') + '</div>';
    if (exams.length >= 2) h += chartSVG(exams);
    else h += '<p class="empty">' + (exams.length ? 'Haz un simulacro más para ver tu evolución.' : 'Todavía no hiciste ningún simulacro. Cuando hagas dos, aquí verás cómo sube tu nota.') + '</p>';
    var hist = state.exams.slice(-8).reverse();
    if (hist.length) {
      h += '<div class="hist">' + hist.map(function (e) { return '<div class="hist-row"><span>' + esc(e.title) + '<br><span class="muted" style="font-size:12px">' + esc(fmtDate(e.at)) + '</span></span><span class="muted">' + e.ok + '/' + e.n + '</span><b style="color:' + pctColor(e.score / 10) + '">' + nota(e.score) + '</b></div>'; }).join('') + '</div>';
    }
    h += '</section>';
    return h;
  }

  /* ---------------- ESTUDIAR ---------------- */
  function prioTag(p) { return p === 3 ? '<span class="prio prio-3">Cae seguro</span>' : '<span class="prio prio-2">Importante</span>'; }
  function studyHTML() {
    var done = MODS.filter(function (m) { return state.mods[m.id]; }).length;

      '<div class="fast"><span>Si tienes poco tiempo:</span>' + ['ciclo', 'lancamento', 'vida', 'especies', 'tributo', 'reforma'].map(function (id) { return '<a href="#m-' + id + '">' + MMAP[id].n + '</a>'; }).join('<span aria-hidden="true">→</span>') + '</div></header>';

    }).join('') + '</div>';

  /* ---------------- MÓDULO ---------------- */
  var mini = null;

      '<div class="row"><button class="btn btn-sm' + (d ? '' : ' btn-primary') + '" data-act="toggle-done" data-mod="' + m.id + '" aria-pressed="' + (!!d) + '">' + (d ? '✓ Estudiado' : 'Marcar como estudiado') + '</button>' + (d ? '<span class="stamp" style="--stamp:var(--good)">Estudado</span>' : '') + '</div></header>';
    h += '<section class="summary"><h2>En 30 segundos <span class="eyebrow">para memorizar</span></h2><ul>' + m.summary.map(function (s) { return '<li><span>' + s + '</span></li>'; }).join('') + '</ul></section>';
    h += '<article class="lesson">' + m.body + '</article>';

    h += '<section class="note-item"><label for="note-' + m.id + '">Mis notas de este módulo <span class="saved" data-saved="' + m.id + '"></span></label><textarea id="note-' + m.id + '" data-note="' + m.id + '" placeholder="Escribe aquí lo que te cuesta recordar o una duda para el profesor"></textarea></section>';
    h += '<div class="row-between">' + (prev ? '<a class="btn" href="#m-' + prev.id + '">← ' + esc(prev.title) + '</a>' : '<span></span>') +
      (nxt ? '<a class="btn btn-primary" href="#m-' + nxt.id + '" data-act="next-mod" data-mod="' + m.id + '">' + esc(nxt.title) + ' →</a>' : '<a class="btn btn-primary" href="#simulado">Ir a los simulacros →</a>') + '</div>';
    mini = null;

  }

  function newMini(m) {
    var pool = QS.filter(function (q) { return m.topics.indexOf(q.t) >= 0; });
    var pick = pickFrom(pool, 3, new Set());
    mini = { mod: m.id, items: pick.map(function (q) { return { q: q, order: shuffle([0, 1, 2, 3]), chosen: null }; }) };
  }
  function renderMini(el) {
    el.innerHTML = mini.items.map(function (it, i) { return qHTML(it.q, it.order, it.chosen, it.chosen != null, 'Pregunta ' + (i + 1) + ' de 3'); }).join('');
  }

  function qHTML(q, order, chosen, reveal, label) {
    var h = '<div class="qcard" data-qid="' + q.id + '"><div class="q-meta"><span class="eyebrow">' + esc(TOP[q.t].name) + (label ? ' · ' + esc(label) : '') + '</span></div>' +
      '<p class="q-text">' + esc(q.q) + '</p><div class="opts" role="group" aria-label="Alternativas">';
    order.forEach(function (ai, di) {
      var cls = 'opt';
      if (reveal) { if (ai === 0) cls += ' ok'; else if (di === chosen) cls += ' no'; else cls += ' fade'; }
      else if (di === chosen) cls += ' sel';

    });

    if (reveal) {
      var ok = order[chosen] === 0;

  /* ---------------- widgets ---------------- */
  function wArt3(el) {
    var segs = WID.art3, sel = -1;
    function draw() {
      var txt = segs.map(function (s, i) { return s.k ? '<button type="button" class="term" data-i="' + i + '" aria-pressed="' + (i === sel) + '">' + esc(s.k) + '</button>' : esc(s.t); }).join('');
      el.innerHTML = '<div class="art3"><p class="art3-text">' + txt + '</p><div class="art3-tip" aria-live="polite">' + (sel >= 0 ? '<b>' + esc(segs[sel].k) + ':</b> ' + segs[sel].d : '<span class="muted">Toca una parte resaltada para ver qué significa.</span>') + '</div></div>';
    }
    el.addEventListener('click', function (e) { var b = e.target.closest('.term'); if (!b) return; sel = +b.getAttribute('data-i'); draw(); var nb = el.querySelector('.term[data-i="' + sel + '"]'); if (nb) nb.focus(); });

  }
  function wCiclo(el) {
    var st = WID.ciclo, i = 0;
    function draw() {
      var s = st[i];
      el.innerHTML = '<div class="ciclo"><div class="ciclo-steps" role="group" aria-label="Etapas del ciclo">' + st.map(function (x, j) { return '<button type="button" class="cstep" data-i="' + j + '" aria-pressed="' + (j === i) + '"><span>' + (j + 1) + ' · ' + esc(x.tag) + '</span><b>' + esc(x.k) + '</b></button>'; }).join('') + '</div>' +
        '<div class="cdetail" aria-live="polite"><span class="eyebrow">Etapa ' + (i + 1) + ' de ' + st.length + ' · ' + esc(s.tag) + '</span><h4>' + esc(s.k) + '</h4><p>' + s.d + '</p><p class="ex">' + esc(s.ex) + '</p>' +
        '<div class="row-between"><button type="button" class="btn btn-sm" data-step="-1"' + (i === 0 ? ' disabled' : '') + '>← Anterior</button><button type="button" class="btn btn-sm btn-primary" data-step="1"' + (i === st.length - 1 ? ' disabled' : '') + '>Siguiente etapa →</button></div></div></div>';
    }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('.cstep'); if (b) { i = +b.getAttribute('data-i'); draw(); return; }
      var s = e.target.closest('[data-step]'); if (s && !s.disabled) { i = Math.max(0, Math.min(st.length - 1, i + +s.getAttribute('data-step'))); draw(); }
    });
    draw();
  }
  function wClassify(el, key) {
    var cfg = WID.classify[key]; if (!cfg) return;
    var order, i, score, answered;
    function reset() { order = shuffle(cfg.items.map(function (_, k) { return k; })); i = 0; score = 0; answered = null; }
    function cat(k) { var c = cfg.cats.filter(function (x) { return x[0] === k; })[0]; return c ? c[1] : k; }
    function draw() {
      if (i >= order.length) {
        el.innerHTML = '<div class="clsf"><span class="eyebrow">Terminaste</span><p class="clsf-item">' + score + ' de ' + order.length + ' correctas</p><div class="row"><button type="button" class="btn btn-primary" data-c="again">Repetir mezclado</button></div></div>';
        return;
      }
      var it = cfg.items[order[i]];
      var h = '<div class="clsf"><div class="row-between"><span class="eyebrow">Ítem ' + (i + 1) + ' de ' + order.length + '</span><span class="m-pct">' + score + ' correctas</span></div><p class="clsf-item">' + esc(it[0]) + '</p>';
      h += '<div class="clsf-cats">' + cfg.cats.map(function (c) {
        var cls = 'btn';
        if (answered) { if (c[0] === it[1]) cls += ' btn-primary'; }
        return '<button type="button" class="' + cls + '" data-cat="' + c[0] + '"' + (answered ? ' disabled' : '') + '>' + esc(c[1]) + '</button>';
      }).join('') + '</div>';
      if (answered) {
        var ok = answered === it[1];
        h += '<div class="clsf-fb ' + (ok ? 'ok' : 'no') + '" role="status"><b>' + (ok ? 'Correcto: ' : 'No: es ') + esc(cat(it[1])) + '</b>' + esc(it[2]) + '</div><div class="row"><button type="button" class="btn btn-primary" data-c="next">Siguiente</button></div>';
      }
      el.innerHTML = h + '</div>';
    }
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-cat]');
      if (b && !answered) { answered = b.getAttribute('data-cat'); if (answered === cfg.items[order[i]][1]) score++; draw(); var n = el.querySelector('[data-c="next"]'); if (n) n.focus(); return; }
      var c = e.target.closest('[data-c]');
      if (c) { if (c.getAttribute('data-c') === 'next') { i++; answered = null; } else reset(); draw(); }
    });
    reset(); draw();
  }

      : '<div><button type="button" class="btn btn-quiet btn-sm" data-act="quit">Salir del simulacro</button></div>';

  /* ---------------- TARJETAS ---------------- */

  }

    h += '<div class="flash-wrap">';

    h += '<div class="meter"><i style="width:' + (inTopic ? known / inTopic * 100 : 0) + '%;background:var(--good)"></i></div>';
    if (!fc.deck.length || fc.pos >= fc.deck.length) {
      h += '<div class="empty" style="text-align:center;display:grid;gap:12px;justify-items:center"><b style="font-size:18px;color:var(--ink)">' + (known === inTopic ? '¡Dominaste todas las tarjetas de este tema!' : 'Terminaste esta ronda.') + '</b><div class="row" style="justify-content:center"><button type="button" class="btn btn-primary" data-act="fc-restart">Otra ronda</button>' + (known ? '<button type="button" class="btn" data-act="fc-reset">Volver a marcar todas como pendientes</button>' : '') + '</div></div>';
    } else {

        '<button type="button" class="face face-back" data-act="flip" aria-label="Volver a la pregunta"' + (fc.flip ? '' : ' tabindex="-1" aria-hidden="true"') + '><span class="eyebrow">' + esc(c[1]) + '</span><span>' + esc(c[2]) + '</span></button>' +
        '</div></div>';

    }

  /* ---------------- NOTAS ---------------- */
  function notesHTML() {
    var h = '<header class="mod-head"><span class="eyebrow">Notas</span><h1>Mis notas</h1><p class="sub">Se guardan solas mientras escribes. Son las mismas que aparecen al final de cada módulo.</p></header><div class="notes-grid">';

  /* ---------------- enlaces de la vista ---------------- */
  var noteT = {};
  function bind() {
    view.querySelectorAll('[data-widget]').forEach(function (el) {
      var w = el.getAttribute('data-widget');
      if (w === 'art3') wArt3(el); else if (w === 'ciclo') wCiclo(el); else if (w === 'classify') wClassify(el, el.getAttribute('data-key'));
    });
    var miniEl = view.querySelector('[data-mini]');
    if (miniEl && route.v === 'modulo') { newMini(MMAP[route.id]); renderMini(miniEl); }
    view.querySelectorAll('textarea[data-note]').forEach(function (ta) {
      var k = ta.getAttribute('data-note');
      ta.value = state.notes[k] || '';
      ta.addEventListener('input', function () {
        var lab = view.querySelector('[data-saved="' + k + '"]'); if (lab) lab.textContent = 'Guardando…';
        clearTimeout(noteT[k]);
        noteT[k] = setTimeout(function () {
          var v = ta.value;
          if (v.trim()) state.notes[k] = v; else delete state.notes[k];
          save(); if (lab) lab.textContent = 'Guardado';
        }, 700);
      });
    });
    var dateIn = document.getElementById('exam-date');
    if (dateIn) dateIn.addEventListener('change', function () { state.examDate = dateIn.value || ''; save(); render(false); });
    var fcT = document.getElementById('fc-topic');
    if (fcT) fcT.addEventListener('change', function () { fc.topic = fcT.value; buildDeck(); render(false); });
    var fcP = document.getElementById('fc-pend');
    if (fcP) fcP.addEventListener('change', function () { fc.pend = fcP.checked; buildDeck(); render(false); });
  }

  /* ---------------- clics globales ---------------- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a && !e.defaultPrevented) { var tok = a.getAttribute('href').slice(1); if (tok && (VIEWS.indexOf(tok) >= 0 || tok.indexOf('m-') === 0)) { e.preventDefault(); confirmFinish = confirmQuit = false; go(tok); return; } }

    var opt = e.target.closest('[data-opt]');
    if (opt && !opt.disabled) {
      var di = +opt.getAttribute('data-opt'), card = opt.closest('.qcard');
      if (view.querySelector('[data-mini]') && card && card.closest('[data-mini]')) {
        var it = mini.items.filter(function (x) { return x.q.id === card.getAttribute('data-qid'); })[0];
        if (it && it.chosen == null) { it.chosen = di; record(it.q, it.order[di] === 0); save(); renderMini(view.querySelector('[data-mini]')); }
        return;
      }
      if (sess && !sess.fin && route.v === 'simulado') {
        if (sess.mode === 'exam') { sess.ans[sess.cur] = di; saveSess(); render(false); }
        else if (sess.ans[sess.cur] == null) {
          sess.ans[sess.cur] = di; var cq = QMAP[sess.items[sess.cur].id];
          record(cq, sess.items[sess.cur].order[di] === 0); save(); saveSess(); render(false);
        }
        var fbEl = view.querySelector('.fb'); if (fbEl) fbEl.scrollIntoView({ block: 'nearest' });
      }
      return;
    }

    var j = e.target.closest('[data-jump]');
    if (j && sess) { sess.cur = +j.getAttribute('data-jump'); saveSess(); render(true); return; }

    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    switch (act) {
      case 'start-exam': startSession('exam'); break;
      case 'start-quick': startSession('quick'); break;
      case 'start-topic': startSession('topic', b.getAttribute('data-topic')); break;
      case 'start-topic-sel': startSession('topic', document.getElementById('topic-sel').value); break;
      case 'start-wrong': startSession('wrong'); break;
      case 'practice-these': startSession('wrong', b.getAttribute('data-ids').split(',')); break;
      case 'prev': if (sess.cur > 0) { sess.cur--; confirmFinish = false; saveSess(); render(true); } break;
      case 'next': if (sess.cur < sess.items.length - 1) { sess.cur++; confirmFinish = false; saveSess(); render(true); } break;
      case 'finish':
        if (sess.mode === 'exam') { confirmFinish = true; render(false); var cf = view.querySelector('.confirm'); if (cf) cf.scrollIntoView({ block: 'center' }); }
        else { finishSession(); render(true); }
        break;
      case 'finish-yes': confirmFinish = false; finishSession(); render(true); break;
      case 'finish-no': confirmFinish = false; render(false); break;
      case 'quit': confirmQuit = true; render(false); break;
      case 'quit-no': confirmQuit = false; render(false); break;
      case 'quit-yes': confirmQuit = false; sess = null; saveSess(); render(true); break;
      case 'close-result': sess = null; saveSess(); render(true); break;
      case 'toggle-done': {
        var id = b.getAttribute('data-mod');
        if (state.mods[id]) delete state.mods[id]; else state.mods[id] = Date.now();
        save(); render(false); toast(state.mods[id] ? 'Módulo marcado como estudiado' : 'Módulo marcado como pendiente');
        break;
      }
      case 'mini-new': { var mEl = view.querySelector('[data-mini]'); if (mEl) { newMini(MMAP[route.id]); renderMini(mEl); } break; }
      case 'flip': fc.flip = !fc.flip; render(false); var f = view.querySelector(fc.flip ? '.face-back' : '.face-front'); if (f) f.focus(); break;
      case 'fc-know': state.cards['c' + fc.deck[fc.pos]] = 1; save(); fc.pos++; fc.flip = false; render(false); break;
      case 'fc-again': fc.deck.push(fc.deck[fc.pos]); fc.pos++; fc.flip = false; render(false); break;
      case 'fc-shuffle': buildDeck(); render(false); break;
      case 'fc-restart': buildDeck(); render(false); break;
      case 'fc-reset':
        CARDS.forEach(function (c, i) { if (fc.topic === 'all' || c[0] === fc.topic) delete state.cards['c' + i]; });
        save(); buildDeck(); render(false); break;
    }
  });

  /* "Siguiente módulo" marca el actual como estudiado si aún no lo está */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act="next-mod"]');
    if (b) { var id = b.getAttribute('data-mod'); if (!state.mods[id]) { state.mods[id] = Date.now(); save(); } }
  }, true);

  setInterval(function () { var t = view.querySelector('[data-timer]'); if (t && sess && !sess.fin) t.textContent = mmss((Date.now() - sess.start) / 1000); }, 1000);

  render(false);
  initRemote();
})();

</script>

</body></html>
